name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux baseline / Node 24.15
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AM_E2E: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm fmt --check
      - name: Check governance and types
        run: pnpm check
      - name: Build and publish standalone skills
        run: pnpm build
      - name: Check artifact consistency
        run: node scripts/build-skills.ts --check
      - name: Require Chrome for browser integration tests
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          printf 'AM_CHROME=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Run unit tests from source
        run: pnpm test --kind unit
      - name: Run integration tests against the artifacts
        run: pnpm test --kind integration
      - name: Validate standalone distributions
        run: node scripts/validate-distribution.ts
      - name: Reject tracked, untracked, and ignored artifact drift
        shell: bash
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- skills skills-sources.json skills-lock.json LICENSE)"
          if test -n "$changes"; then
            printf '%s\n' "$changes"
            printf '%s\n' 'Managed artifacts differ from the checkout. Rebuild and review them locally.'
            exit 1
          fi
      - name: Archive the standalone skill for Node 20
        shell: bash
        run: tar -czf "$RUNNER_TEMP/mark.tar.gz" -C skills mark
      - uses: actions/upload-artifact@v4
        with:
          name: mark-runtime
          path: ${{ runner.temp }}/mark.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows paths and installation / Node 24.15
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mark-runtime
          path: ${{ runner.temp }}/skills install source 空间
      - name: Install and render through paths with spaces and Unicode
        shell: bash
        run: node scripts/smoke-install-mark.ts
      - name: Reject tracked, untracked, and ignored artifact drift
        shell: bash
        run: |
          changes="$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- skills skills-sources.json skills-lock.json LICENSE)"
          if test -n "$changes"; then
            printf '%s\n' "$changes"
            printf '%s\n' 'Managed artifacts differ from the checkout. Rebuild and review them locally.'
            exit 1
          fi

  runtime20:
    name: Standalone runtime / Node 20
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: mark-runtime
          path: ${{ runner.temp }}/skills-runtime20
      - name: Render with the assembled skill and no workspace dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP/skills-runtime20"
          tar -xzf mark.tar.gz
          node mark/scripts/am.mjs help
          node mark/scripts/am.mjs render - --no-open -o "$RUNNER_TEMP/skills-runtime20/smoke.html" <<'MARKDOWN'
          ---
          title: Node 20 runtime
          ---
          ## A Standalone render
          This page was rendered from the assembled skill.
          MARKDOWN
          test -s "$RUNNER_TEMP/skills-runtime20/smoke.html"
