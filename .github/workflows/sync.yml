name: Review external skill updates

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true

      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile
      - name: Fetch configured external skills
        id: sync
        shell: bash
        run: |
          node scripts/cli.ts sync 2>&1 | tee "$RUNNER_TEMP/skills-sync.log"
      - name: Check the updated distribution
        id: distribution
        run: node scripts/validate-distribution.ts
      - name: Capture a review patch and report
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.distribution.outcome }}
        run: node scripts/report-skill-sync.ts
      - name: Upload the review patch and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-sync-report
          path: ${{ runner.temp }}/skills-sync-report/
          if-no-files-found: error
          retention-days: 14
